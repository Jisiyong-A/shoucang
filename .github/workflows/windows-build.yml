name: Windows Build

on:
  push:
    branches: [main, windows-redesign]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build installer (NSIS)
        run: npm run tauri:build
        env:
          # self-hosted proxies only apply to the local machine; CI is direct
          HTTPS_PROXY: ""
          HTTP_PROXY: ""

      - name: Verify bundle completeness
        run: python scripts/e2e/bundle-completeness.py

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.txt
          if-no-files-found: error
