[package]
name = "shoucang"
version = "0.1.0"
description = "Local desktop shell for 收藏"
authors = ["Patrick"]
edition = "2021"

# Shared core: desktop (bin) and Android (mobile entry via JNI) both use
# this lib target; Android needs cdylib/staticlib for the .so.
[lib]
name = "shoucang_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# rustc 1.95 LLVM crashes at opt-level=3 on this crate (out of memory);
# opt-level=2 compiles cleanly with negligible runtime difference.
[profile.release]
opt-level = 2

[dependencies]
tauri = { version = "2", features = [] }
